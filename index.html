<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315b4c">
<title>彌勒山12人小組勤務安排</title>
<style>
:root{
  --bg:#f4f6f3;--ink:#25312c;--muted:#748078;--line:#d8dfdb;
  --brand:#3d735f;--brand-dark:#315b4c;--brand-soft:#e9f1ed;
  --warn-bg:#fff5d8;--warn-line:#ead28d;--warn-ink:#66531a;
  --accent:#b74739;--today:#fff7d2;--today-head:#efd36f;
  --shadow:0 10px 28px rgba(32,58,48,.08)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

.notice{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:9px;min-height:46px;padding:0 12px;background:var(--warn-bg);border-bottom:1px solid var(--warn-line);color:var(--warn-ink)}
.notice-icon{font-size:18px;flex:0 0 auto}
.notice-window{position:relative;height:28px;flex:1;overflow:hidden}
.notice-item{position:absolute;inset:0;display:flex;align-items:center;font-size:14px;line-height:1.3;font-weight:800;opacity:0;transform:translateY(110%);transition:transform .55s ease,opacity .42s ease;will-change:transform,opacity}
.notice-item.show{opacity:1;transform:translateY(0)}
.notice-item.out{opacity:0;transform:translateY(-110%)}

.hero{background:linear-gradient(135deg,var(--brand-dark),#4d7b69);color:#fff;padding:18px 14px 15px}
.hero-inner{max-width:1500px;margin:0 auto}
h1{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.2}
.sub{margin-top:6px;font-size:14px;opacity:.92}
.sync{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;opacity:.86}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#a6e4bd;box-shadow:0 0 0 3px rgba(166,228,189,.14)}

.wrap{max-width:1500px;margin:0 auto;padding:10px 10px 22px}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:9px}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer}
.hint{margin-left:auto;color:var(--muted);font-size:11px}
.shell{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 180px);overscroll-behavior:contain}

table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;table-layout:fixed;background:#fff}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
tr>*:last-child{border-right:0}
tbody tr:last-child>*{border-bottom:0}
.corner,.row-label{position:sticky;left:0;z-index:12;width:48px;min-width:48px;max-width:48px;background:#f8faf8;font-weight:900}
.group-row th{position:sticky;top:0;z-index:20;height:34px;padding:5px 6px;background:var(--brand-soft);color:var(--brand-dark);font-size:12px;font-weight:900}
.group-row .corner{z-index:30}
.date-row th{position:sticky;top:34px;z-index:19;height:46px;padding:5px 6px;background:#edf2ef;font-size:14px;font-weight:900;white-space:nowrap}
.date-row .corner{z-index:29}
.time-row th{position:sticky;top:80px;z-index:18;min-height:48px;padding:5px 6px;background:#fbfcfb;color:var(--accent);font-size:11px;line-height:1.35;font-weight:900;white-space:normal}
.time-row .corner{z-index:28;color:var(--ink)}
.day-col{width:138px;min-width:138px;max-width:138px}
.today-col{background:var(--today)!important}
.date-row .today-col{background:var(--today-head)!important;color:#6c5411}
.today-mark{display:block;margin-top:2px;font-size:10px;color:#72590f;font-weight:900}
tbody td{height:42px;padding:5px 6px;background:#fff;font-size:14px;line-height:1.25;word-break:break-word}
tbody tr:nth-child(even) td:not(.today-col){background:#fbfcfb}
.person{font-weight:800}.empty{color:#c9d0cc}.group-start{border-left:3px solid #a6b9af!important}
.notes-row td{height:auto;padding:8px;text-align:left;background:#fbf9f1;color:#625c4f;font-size:12px;line-height:1.45}
.notes-row .row-label{text-align:center;background:#f4f2eb;color:var(--ink)}
.status{padding:42px 18px;text-align:center;color:var(--muted)}
.error-title{font-weight:900;color:#8f3f34;margin-bottom:7px}
.footer{padding:9px 6px 0;text-align:center;color:var(--muted);font-size:11px}

@media(max-width:640px){
  .notice{min-height:42px;padding:0 9px}.notice-window{height:25px}.notice-item{font-size:12px}
  .hero{padding:13px 10px 12px}h1{font-size:23px}.sub{font-size:12px}.wrap{padding:7px 6px 15px}
  .hint{width:100%;margin-left:0}.shell{border-radius:9px}.scroll{max-height:calc(100vh - 158px)}
  .corner,.row-label{width:40px;min-width:40px;max-width:40px;font-size:11px}
  .day-col{width:104px;min-width:104px;max-width:104px}
  .group-row th{height:31px;padding:4px 3px;font-size:10px}
  .date-row th{top:31px;height:40px;padding:4px 3px;font-size:12px}
  .time-row th{top:71px;padding:4px 3px;font-size:9.5px}
  tbody td{height:38px;padding:4px 3px;font-size:12px}
}
</style>
</head>
<body>
<div class="notice" id="notice" hidden>
  <div class="notice-icon">🔔</div>
  <div class="notice-window">
    <div class="notice-item show" id="noticeA"></div>
    <div class="notice-item" id="noticeB"></div>
  </div>
</div>

<section class="hero">
  <div class="hero-inner">
    <h1 id="title">9/27(日)~10/4(日) 彌勒山12人小組</h1>
    <div class="sub" id="subtitle">9/27（日）～10/4（日）</div>
    <div class="sync">
      <span><span class="dot"></span><span id="syncText">正在同步資料…</span></span>
      <span id="updated"></span>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="toolbar">
    <button id="todayBtn">跳到今天</button>
    <button id="refreshBtn">立即更新</button>
    <span class="hint">手機可左右滑動；日期、時間與左側序號固定，方便一眼對照。</span>
  </div>
  <div class="shell">
    <div class="scroll" id="tableScroll">
      <div id="content" class="status">正在讀取勤務表…</div>
    </div>
  </div>
  <div class="footer">每 30 秒檢查一次；試算表有變更才重繪表格。</div>
</main>

<script>
// 這是你目前 Apps Script 的部署網址。
// Apps Script 只當資料 API，不會顯示在使用者畫面上。
const API_URL =
  'https://script.google.com/macros/s/AKfycbw_I1GliiFmkZL4sEXYkw7vpuwGraltuopzMCb73gl_LDgQb4VTrYSZ5hGqiDUNWlePQ/exec';

const CHECK_MS = 30000;
let currentData=null,currentVersion='',pollTimer=null,jsonpScript=null;
let noticeTimer=null,noticeMessages=[],noticeIndex=0;

const $=id=>document.getElementById(id);
$('refreshBtn').addEventListener('click',()=>loadData(true));
$('todayBtn').addEventListener('click',jumpToday);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') loadData(false);
});

window.dutyJsonpCallback=function(payload){
  cleanupJsonp();
  if(!payload || !payload.ok){
    showError(payload?.error || 'API 回傳失敗');
    schedule();
    return;
  }

  const data=payload.data;
  if(!currentData || data.version!==currentVersion){
    currentData=data;
    currentVersion=data.version||'';
    render(data);
  }else{
    setSync('已同步');
    $('updated').textContent='最近檢查：'+nowText();
  }
  schedule();
};

function loadData(force){
  clearTimeout(pollTimer);
  cleanupJsonp();
  if(force) setSync('正在更新…');

  const s=document.createElement('script');
  s.src=API_URL
    +'?callback=dutyJsonpCallback'
    +'&_='+Date.now();
  s.async=true;
  s.onerror=()=>{
    cleanupJsonp();
    showError('無法連線到資料 API，請確認 Apps Script 已部署為「任何人」可存取。');
    schedule();
  };
  jsonpScript=s;
  document.head.appendChild(s);
}

function cleanupJsonp(){
  if(jsonpScript && jsonpScript.parentNode) jsonpScript.parentNode.removeChild(jsonpScript);
  jsonpScript=null;
}

function schedule(){
  clearTimeout(pollTimer);
  pollTimer=setTimeout(()=>loadData(false),CHECK_MS);
}

function render(data){
  $('title').textContent=data.title||'彌勒山12人小組勤務安排';
  $('subtitle').textContent=data.subtitle||'';
  setupNotice(data.announcement||'');
  $('content').className='';
  $('content').innerHTML=buildTable(data);
  setSync('已同步');
  $('updated').textContent='最後更新：'+nowText()+'｜每 30 秒檢查';
}

function setupNotice(text){
  clearInterval(noticeTimer);
  noticeMessages=String(text||'').split(/｜|\n/).map(s=>s.trim()).filter(Boolean);
  noticeIndex=0;

  if(!noticeMessages.length){
    $('notice').hidden=true;
    return;
  }

  $('notice').hidden=false;
  const a=$('noticeA'),b=$('noticeB');
  a.textContent=noticeMessages[0];
  a.className='notice-item show';
  b.className='notice-item';
  b.textContent=noticeMessages[1]||noticeMessages[0];

  // 即使只有一則，也會定時做上翻效果。
  noticeTimer=setInterval(()=>{
    const next=(noticeIndex+1)%noticeMessages.length;
    b.textContent=noticeMessages[next]||noticeMessages[0];
    b.className='notice-item';
    void b.offsetWidth;
    a.classList.add('out');a.classList.remove('show');b.classList.add('show');

    setTimeout(()=>{
      noticeIndex=next;
      a.textContent=b.textContent;
      a.className='notice-item show';
      b.className='notice-item';
    },580);
  },4200);
}

function buildTable(data){
  if(!data.days||!data.days.length) return '<div class="status">目前沒有勤務資料。</div>';

  const labels=(data.rowLabels&&data.rowLabels.length)
    ? data.rowLabels
    : Array.from({length:17},(_,i)=>String(i+1));
  const groups=groupSpans(data.days);

  const groupHtml=groups.map(g=>
    `<th class="day-col ${g.start?'group-start':''}" colspan="${g.span}">${esc(g.name)}</th>`
  ).join('');

  const dateHtml=data.days.map((d,i)=>
    `<th class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
      ${esc(d.dateText)}
      ${d.isoDate===data.today?'<span class="today-mark">今天</span>':''}
    </th>`
  ).join('');

  const timeHtml=data.days.map((d,i)=>
    `<th class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
      ${d.time?esc(d.time).replace(/\n/g,'<br>'):'—'}
    </th>`
  ).join('');

  const body=labels.map(label=>{
    const cells=data.days.map((d,i)=>{
      const p=(d.people||[]).find(x=>String(x.no)===String(label));
      return `<td class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
        ${p?`<span class="person">${esc(p.name)}</span>`:'<span class="empty">—</span>'}
      </td>`;
    }).join('');
    return `<tr><th class="row-label">${esc(label)}</th>${cells}</tr>`;
  }).join('');

  const hasNotes=data.days.some(d=>d.notes&&d.notes.length);
  const notes=hasNotes?`
    <tr class="notes-row">
      <th class="row-label">備註</th>
      ${data.days.map((d,i)=>`
        <td class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
          ${(d.notes||[]).map(esc).join('<br>')}
        </td>`).join('')}
    </tr>`:'';

  return `<table>
    <thead>
      <tr class="group-row"><th class="corner">小組</th>${groupHtml}</tr>
      <tr class="date-row"><th class="corner">日期</th>${dateHtml}</tr>
      <tr class="time-row"><th class="corner">時間</th>${timeHtml}</tr>
    </thead>
    <tbody>${body}${notes}</tbody>
  </table>`;
}

function groupSpans(days){
  const out=[];let start=0;
  while(start<days.length){
    const name=days[start].group||'';
    let end=start+1;
    while(end<days.length&&(days[end].group||'')===name) end++;
    out.push({name,span:end-start,start:start>0});
    start=end;
  }
  return out;
}
function groupStart(days,i){
  if(i<=0) return '';
  return (days[i].group||'')!==(days[i-1].group||'')?'group-start':'';
}
function todayClass(d,data){return d.isoDate===data.today?'today-col':''}

function jumpToday(){
  if(!currentData)return;
  const i=currentData.days.findIndex(d=>d.isoDate===currentData.today);
  if(i<0){alert('今天不在這次勤務日期範圍內。');return}
  const target=document.querySelectorAll('.date-row .day-col')[i];
  if(target)$('tableScroll').scrollTo({left:Math.max(0,target.offsetLeft-42),top:0,behavior:'smooth'});
}

function setSync(t){$('syncText').textContent=t}
function showError(msg){
  setSync('同步失敗');
  $('updated').textContent='稍後會自動重試';
  $('content').className='status';
  $('content').innerHTML=
    '<div class="error-title">目前無法讀取勤務資料</div>'+
    '<div>'+esc(msg)+'</div>';
}
function nowText(){
  return new Intl.DateTimeFormat('zh-TW',{
    timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
  }).format(new Date());
}
function esc(v){
  return String(v??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
loadData(true);
</script>
</body>
</html>
