<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#355f50">
  <title>彌勒山12人小組勤務安排</title>
  <style>
    :root{
      --bg:#f4f6f3;
      --card:#ffffff;
      --ink:#25312c;
      --muted:#748078;
      --line:#d8dfdb;
      --brand:#3d735f;
      --brand-dark:#315b4c;
      --brand-soft:#e9f1ed;
      --warn-bg:#fff5d8;
      --warn-line:#ead28d;
      --warn-ink:#66531a;
      --accent:#b74739;
      --today:#fff7d2;
      --today-head:#efd36f;
      --shadow:0 10px 28px rgba(32,58,48,.08);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",
      "PingFang TC","Microsoft JhengHei",sans-serif;
    }

    /* 上翻式公告 */
    .notice{
      position:sticky;
      top:0;
      z-index:100;
      display:flex;
      align-items:center;
      gap:9px;
      min-height:46px;
      padding:0 12px;
      background:var(--warn-bg);
      border-bottom:1px solid var(--warn-line);
      color:var(--warn-ink);
    }
    .notice-icon{font-size:18px;flex:0 0 auto}
    .notice-window{
      position:relative;
      height:28px;
      flex:1;
      overflow:hidden;
    }
    .notice-item{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      font-size:14px;
      line-height:1.3;
      font-weight:800;
      opacity:0;
      transform:translateY(110%);
      transition:transform .55s ease,opacity .42s ease;
      will-change:transform,opacity;
    }
    .notice-item.show{opacity:1;transform:translateY(0)}
    .notice-item.out{opacity:0;transform:translateY(-110%)}

    .hero{
      background:linear-gradient(135deg,var(--brand-dark),#4d7b69);
      color:#fff;
      padding:18px 14px 15px;
    }
    .hero-inner{max-width:1500px;margin:0 auto}
    h1{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.2}
    .sub{margin-top:6px;font-size:14px;opacity:.92}
    .sync{
      margin-top:10px;
      display:flex;
      flex-wrap:wrap;
      gap:6px 14px;
      font-size:12px;
      opacity:.86;
    }
    .dot{
      display:inline-block;
      width:8px;height:8px;border-radius:50%;
      margin-right:5px;background:#a6e4bd;
      box-shadow:0 0 0 3px rgba(166,228,189,.14);
    }

    .wrap{max-width:1500px;margin:0 auto;padding:10px 10px 22px}
    .toolbar{
      display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:9px
    }
    button{
      appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
      padding:8px 12px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer
    }
    .hint{margin-left:auto;color:var(--muted);font-size:11px}

    .shell{
      background:#fff;border:1px solid var(--line);border-radius:13px;
      box-shadow:var(--shadow);overflow:hidden
    }
    .scroll{
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      max-height:calc(100vh - 180px);
      overscroll-behavior:contain;
    }

    table{
      border-collapse:separate;border-spacing:0;
      width:max-content;min-width:100%;table-layout:fixed;background:#fff
    }
    th,td{
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      text-align:center;vertical-align:middle
    }
    tr>*:last-child{border-right:0}
    tbody tr:last-child>*{border-bottom:0}

    .corner,.row-label{
      position:sticky;left:0;z-index:12;
      width:48px;min-width:48px;max-width:48px;
      background:#f8faf8;font-weight:900
    }

    .group-row th{
      position:sticky;top:0;z-index:20;height:34px;
      padding:5px 6px;background:var(--brand-soft);
      color:var(--brand-dark);font-size:12px;font-weight:900
    }
    .group-row .corner{z-index:30}

    .date-row th{
      position:sticky;top:34px;z-index:19;height:46px;
      padding:5px 6px;background:#edf2ef;font-size:14px;font-weight:900;white-space:nowrap
    }
    .date-row .corner{z-index:29}

    .time-row th{
      position:sticky;top:80px;z-index:18;min-height:48px;
      padding:5px 6px;background:#fbfcfb;color:var(--accent);
      font-size:11px;line-height:1.35;font-weight:900;white-space:normal
    }
    .time-row .corner{z-index:28;color:var(--ink)}

    .day-col{width:138px;min-width:138px;max-width:138px}
    .today-col{background:var(--today)!important}
    .date-row .today-col{background:var(--today-head)!important;color:#6c5411}
    .today-mark{display:block;margin-top:2px;font-size:10px;color:#72590f;font-weight:900}

    tbody td{
      height:42px;padding:5px 6px;background:#fff;
      font-size:14px;line-height:1.25;word-break:break-word
    }
    tbody tr:nth-child(even) td:not(.today-col){background:#fbfcfb}
    .person{font-weight:800}
    .empty{color:#c9d0cc}
    .group-start{border-left:3px solid #a6b9af!important}

    .notes-row td{
      height:auto;padding:8px;text-align:left;
      background:#fbf9f1;color:#625c4f;font-size:12px;line-height:1.45
    }
    .notes-row .row-label{text-align:center;background:#f4f2eb;color:var(--ink)}

    .status{padding:42px 18px;text-align:center;color:var(--muted)}
    .error-title{font-weight:900;color:#8f3f34;margin-bottom:7px}
    .footer{padding:9px 6px 0;text-align:center;color:var(--muted);font-size:11px}

    @media(max-width:640px){
      .notice{min-height:42px;padding:0 9px}
      .notice-window{height:25px}
      .notice-item{font-size:12px}

      .hero{padding:13px 10px 12px}
      h1{font-size:23px}
      .sub{font-size:12px}
      .wrap{padding:7px 6px 15px}
      .hint{width:100%;margin-left:0}
      .shell{border-radius:9px}
      .scroll{max-height:calc(100vh - 158px)}

      .corner,.row-label{
        width:40px;min-width:40px;max-width:40px;font-size:11px
      }
      .day-col{width:104px;min-width:104px;max-width:104px}

      .group-row th{height:31px;padding:4px 3px;font-size:10px}
      .date-row th{top:31px;height:40px;padding:4px 3px;font-size:12px}
      .time-row th{top:71px;padding:4px 3px;font-size:9.5px}
      tbody td{height:38px;padding:4px 3px;font-size:12px}
    }

    @media(prefers-reduced-motion:reduce){
      .notice-window{height:auto}
      .notice-item{position:static;opacity:1;transform:none;transition:none}
      .notice-item:nth-child(2){display:none}
    }
  </style>
</head>
<body>
  <div class="notice" id="notice" hidden>
    <div class="notice-icon">🔔</div>
    <div class="notice-window">
      <div class="notice-item show" id="noticeA"></div>
      <div class="notice-item" id="noticeB"></div>
    </div>
  </div>

  <section class="hero">
    <div class="hero-inner">
      <h1 id="title">9/27(日)~10/4(日) 彌勒山12人小組</h1>
      <div class="sub" id="subtitle">9/27（日）～10/4（日）</div>
      <div class="sync">
        <span><span class="dot"></span><span id="syncText">正在同步資料…</span></span>
        <span id="updated"></span>
      </div>
    </div>
  </section>

  <main class="wrap">
    <div class="toolbar">
      <button id="todayBtn">跳到今天</button>
      <button id="refreshBtn">立即更新</button>
      <span class="hint">手機可左右滑動；日期、時間與左側序號固定，方便一眼對照。</span>
    </div>

    <div class="shell">
      <div class="scroll" id="tableScroll">
        <div id="content" class="status">正在讀取勤務表…</div>
      </div>
    </div>

    <div class="footer">每 30 秒檢查一次資料；只有內容變更才重繪表格。</div>
  </main>

<script>
/*
  正式獨立網頁版
  資料直接讀取「發布到網路」的 Google 試算表，不使用 Apps Script 畫面，
  因此不會出現「這個應用程式是由 Google Apps Script 的使用者建立」提示。
*/
const CONFIG = {
  // 你原本「發布到網路」的公開網址 ID
  PUBLISHED_ID: '2PACX-1vTBPacrVguoUlr4JclG2nG5PBfy_8j7lzc9HecXrTb17cwQwniHB8f-4vKI6Vj2uAh2UK2qpUerPNaN',

  // 2026_9月_初步登記
  DATA_GID: '303688467',

  // 網頁設定
  SETTINGS_GID: '987654321',

  CHECK_MS: 30000,

  FALLBACK_NOTICE:
    '初步先了解能夠參與的日期，如果有不過夜，請明確告知參與的時間範圍'
};

const PUB_BASE =
  `https://docs.google.com/spreadsheets/d/e/${CONFIG.PUBLISHED_ID}/pub`;

let DATA_HASH = '';
let SETTINGS_HASH = '';
let currentData = null;
let syncTimer = null;
let noticeTimer = null;
let noticeMessages = [];
let noticeIndex = 0;

const $ = id => document.getElementById(id);

$('refreshBtn').addEventListener('click', () => sync(true));
$('todayBtn').addEventListener('click', jumpToday);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') sync(false);
});

function csvUrl(gid){
  return `${PUB_BASE}?gid=${encodeURIComponent(gid)}&single=true&output=csv&_=${Date.now()}`;
}

async function getCsv(gid){
  const res = await fetch(csvUrl(gid), {
    cache:'no-store',
    redirect:'follow'
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.text();
}

async function sync(force){
  clearTimeout(syncTimer);
  if(force) setSync('正在更新…');

  try{
    const [dataCsv, settingsResult] = await Promise.all([
      getCsv(CONFIG.DATA_GID),
      getCsv(CONFIG.SETTINGS_GID).catch(() => '')
    ]);

    const dataHash = hashText(dataCsv);
    const settingsHash = hashText(settingsResult);

    if(force || dataHash !== DATA_HASH || settingsHash !== SETTINGS_HASH){
      DATA_HASH = dataHash;
      SETTINGS_HASH = settingsHash;

      const settings = settingsResult ? parseSettings(settingsResult) : {};
      currentData = buildData(dataCsv, settings);
      render(currentData);
    }else{
      setSync('已同步');
      $('updated').textContent = '最近檢查：' + nowText();
    }
  }catch(err){
    showError(err);
  }finally{
    syncTimer = setTimeout(() => sync(false), CONFIG.CHECK_MS);
  }
}

function buildData(csv, settings){
  const rows = parseCsv(csv);
  if(!rows.length) throw new Error('試算表沒有資料');

  const title = val(rows,0,0) || '彌勒山12人小組勤務安排';
  const groupRow = slicePad(rows[1] || [],1,9);
  const dateRow = slicePad(rows[2] || [],1,9);
  const timeRow = slicePad(rows[3] || [],1,9);

  let noteIndex = rows.findIndex(r => String(r[0] || '').trim() === '備註');
  if(noteIndex < 0) noteIndex = rows.length;

  const rowLabels = [];
  for(let r=4;r<noteIndex;r++){
    const label = val(rows,r,0).trim();
    if(label) rowLabels.push(label);
  }

  const groups=[];
  let currentGroup='';
  for(let i=0;i<8;i++){
    const g=(groupRow[i]||'').replace(/\s+/g,' ').trim();
    if(g) currentGroup=g;
    groups.push(currentGroup);
  }

  const days=[];
  for(let c=0;c<8;c++){
    const dateText=String(dateRow[c]||'').trim();
    if(!dateText) continue;

    const people=[];
    for(let r=4;r<noteIndex;r++){
      const name=val(rows,r,c+1).trim();
      if(name){
        people.push({no:val(rows,r,0).trim(),name});
      }
    }

    const notes=[];
    for(let r=noteIndex;r<rows.length;r++){
      const note=val(rows,r,c+1).trim();
      if(note) notes.push(note);
    }

    days.push({
      dateText,
      isoDate:toIso(dateText),
      group:groups[c]||'',
      time:String(timeRow[c]||'').trim(),
      people,
      notes
    });
  }

  const notice = (
    settings['跑馬燈公告'] ||
    settings['上翻式公告'] ||
    CONFIG.FALLBACK_NOTICE
  ).trim();

  return {
    title,
    subtitle:settings['頁面副標題'] || '9/27（日）～10/4（日）',
    notice,
    days,
    rowLabels,
    today:todayIso()
  };
}

function parseSettings(csv){
  const rows=parseCsv(csv);
  const out={};
  rows.forEach((row,i)=>{
    if(i===0) return;
    const key=String(row[0]||'').trim();
    if(key) out[key]=String(row[1]||'').trim();
  });
  return out;
}

function render(data){
  $('title').textContent=data.title;
  $('subtitle').textContent=data.subtitle || '';
  setupNotice(data.notice);
  $('content').className='';
  $('content').innerHTML=buildTable(data);
  setSync('已同步');
  $('updated').textContent='最後更新：'+nowText()+'｜每 30 秒檢查';
}

function setupNotice(text){
  clearInterval(noticeTimer);

  // 可用「｜」或換行建立多則上翻公告。
  noticeMessages=String(text||'')
    .split(/｜|\n/)
    .map(s=>s.trim())
    .filter(Boolean);

  if(!noticeMessages.length){
    $('notice').hidden=true;
    return;
  }

  $('notice').hidden=false;
  noticeIndex=0;

  const a=$('noticeA'), b=$('noticeB');
  a.textContent=noticeMessages[0];
  a.className='notice-item show';
  b.className='notice-item';

  // 只有一則時也做循環上翻效果。
  b.textContent=noticeMessages.length>1 ? noticeMessages[1] : noticeMessages[0];

  noticeTimer=setInterval(()=>{
    const nextIndex=(noticeIndex+1)%noticeMessages.length;
    b.textContent=noticeMessages[nextIndex] || noticeMessages[0];

    b.className='notice-item';
    void b.offsetWidth;

    a.classList.add('out');
    a.classList.remove('show');
    b.classList.add('show');

    setTimeout(()=>{
      noticeIndex=nextIndex;
      a.textContent=b.textContent;
      a.className='notice-item show';
      b.className='notice-item';
    },580);
  },4200);
}

function buildTable(data){
  if(!data.days.length) return '<div class="status">目前沒有勤務資料。</div>';

  const labels=data.rowLabels.length ? data.rowLabels : Array.from({length:17},(_,i)=>String(i+1));
  const groups=groupSpans(data.days);

  const groupHtml=groups.map(g=>
    `<th class="day-col ${g.start?'group-start':''}" colspan="${g.span}">${esc(g.name)}</th>`
  ).join('');

  const dateHtml=data.days.map((d,i)=>
    `<th class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
      ${esc(d.dateText)}
      ${d.isoDate===data.today?'<span class="today-mark">今天</span>':''}
    </th>`
  ).join('');

  const timeHtml=data.days.map((d,i)=>
    `<th class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
      ${d.time?esc(d.time).replace(/\n/g,'<br>'):'—'}
    </th>`
  ).join('');

  const body=labels.map(label=>{
    const cells=data.days.map((d,i)=>{
      const p=(d.people||[]).find(x=>String(x.no)===String(label));
      return `<td class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
        ${p?`<span class="person">${esc(p.name)}</span>`:'<span class="empty">—</span>'}
      </td>`;
    }).join('');
    return `<tr><th class="row-label">${esc(label)}</th>${cells}</tr>`;
  }).join('');

  const hasNotes=data.days.some(d=>d.notes&&d.notes.length);
  const notes=hasNotes?`
    <tr class="notes-row">
      <th class="row-label">備註</th>
      ${data.days.map((d,i)=>`
        <td class="day-col ${todayClass(d,data)} ${groupStart(data.days,i)}">
          ${(d.notes||[]).map(esc).join('<br>')}
        </td>`).join('')}
    </tr>`:'';

  return `<table>
    <thead>
      <tr class="group-row"><th class="corner">小組</th>${groupHtml}</tr>
      <tr class="date-row"><th class="corner">日期</th>${dateHtml}</tr>
      <tr class="time-row"><th class="corner">時間</th>${timeHtml}</tr>
    </thead>
    <tbody>${body}${notes}</tbody>
  </table>`;
}

function groupSpans(days){
  const out=[];
  let start=0;
  while(start<days.length){
    const name=days[start].group||'';
    let end=start+1;
    while(end<days.length&&(days[end].group||'')===name) end++;
    out.push({name,span:end-start,start:start>0});
    start=end;
  }
  return out;
}

function groupStart(days,i){
  if(i<=0) return '';
  return (days[i].group||'') !== (days[i-1].group||'') ? 'group-start' : '';
}

function todayClass(day,data){
  return day.isoDate===data.today?'today-col':'';
}

function jumpToday(){
  if(!currentData) return;
  const i=currentData.days.findIndex(d=>d.isoDate===currentData.today);
  if(i<0){
    alert('今天不在這次勤務日期範圍內。');
    return;
  }
  const scroll=$('tableScroll');
  const cells=document.querySelectorAll('.date-row .day-col');
  const target=cells[i];
  if(target){
    scroll.scrollTo({left:Math.max(0,target.offsetLeft-42),top:0,behavior:'smooth'});
  }
}

function parseCsv(text){
  const rows=[];
  let row=[],field='',quoted=false;

  for(let i=0;i<text.length;i++){
    const ch=text[i];

    if(quoted){
      if(ch==='"' && text[i+1]==='"'){
        field+='"';i++;
      }else if(ch==='"'){
        quoted=false;
      }else{
        field+=ch;
      }
    }else{
      if(ch==='"'){
        quoted=true;
      }else if(ch===','){
        row.push(field);field='';
      }else if(ch==='\n'){
        row.push(field);rows.push(row);row=[];field='';
      }else if(ch!=='\r'){
        field+=ch;
      }
    }
  }
  row.push(field);
  if(row.length>1 || row[0]!=='' || rows.length===0) rows.push(row);
  return rows;
}

function hashText(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){
    h^=s.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return (h>>>0).toString(16);
}

function val(rows,r,c){
  return String((rows[r]&&rows[r][c])??'');
}

function slicePad(arr,a,b){
  const out=[];
  for(let i=a;i<b;i++) out.push(String(arr[i]??''));
  return out;
}

function toIso(text){
  const m=String(text).match(/(\d{1,2})\/(\d{1,2})/);
  if(!m) return '';
  return `2026-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;
}

function todayIso(){
  const p=new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'
  }).formatToParts(new Date());
  const o={};
  p.forEach(x=>o[x.type]=x.value);
  return `${o.year}-${o.month}-${o.day}`;
}

function nowText(){
  return new Intl.DateTimeFormat('zh-TW',{
    timeZone:'Asia/Taipei',
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',
    hour12:false
  }).format(new Date());
}

function setSync(t){$('syncText').textContent=t}

function showError(err){
  setSync('同步失敗');
  $('updated').textContent='稍後會自動重試';
  $('content').className='status';
  $('content').innerHTML=`
    <div class="error-title">目前無法讀取 Google 試算表</div>
    <div>請確認「發布到網路」仍為啟用狀態，再按「立即更新」。</div>
    <div style="margin-top:6px;font-size:11px">${esc(err?.message||String(err))}</div>`;
}

function esc(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

sync(true);
</script>
</body>
</html>
